name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q stunslam.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cd stunslam && chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: stunslam-jar
          path: stunslam/build/libs/*.jar
